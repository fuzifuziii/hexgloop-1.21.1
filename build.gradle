plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
    id 'org.jetbrains.kotlin.jvm'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

// Minecraft 1.21.1 ships Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

kotlin {
    jvmToolchain(21)
}

repositories {
    maven {
        name = "BlameJared Maven" // Patchouli
        url = "https://maven.blamejared.com"
    }
    maven {
        name = "ParchmentMC Maven"
        url = "https://maven.parchmentmc.org"
    }
    maven {
        name = "Curios"
        url = "https://maven.theillusivec4.top/"
    }
    exclusiveContent {
        forRepository {
            maven {
                name = 'Kotlin for Forge'
                url = 'https://thedarkcolour.github.io/KotlinForForge/'
            }
        }
        filter {
            includeGroup "thedarkcolour"
        }
    }
    exclusiveContent {
        forRepository {
            maven {
                name = "Modrinth"
                url = "https://api.modrinth.com/maven"
            }
        }
        filter {
            includeGroup "maven.modrinth"
        }
    }
    // Local dev builds of HexCasting / PAUCAL / MoreIotas (/ Hexal) for 1.21.1, see libs/.
    exclusiveContent {
        forRepository {
            flatDir {
                dirs "libs"
            }
        }
        filter {
            includeGroup "libs"
        }
    }
    maven { url = "https://maven.architectury.dev/" }
    maven { url = "https://maven.emi.dev/releases" }
    maven { url = "https://maven.shedaniel.me/" }
    mavenCentral()
}

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }


    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            systemProperty 'mixin.debug.export', 'true'
            logLevel = org.slf4j.event.Level.INFO
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation("libs:hexcasting-neoforge-$minecraft_version:$hexcasting_version")
    implementation("libs:paucal:$paucal_version+$minecraft_version-neoforge")
    implementation("libs:moreiotas-${moreiotas_version}-${minecraft_version}-devel-pre-${moreiotas_pre_num}")
    // Hexal is optional at runtime (HexalLabels is guarded by Platform.isModLoaded), but needed to compile compat code.
    compileOnly("libs:hexal:$hexal_version")
    localRuntime("libs:hexal:$hexal_version")

    implementation("vazkii.patchouli:Patchouli:$minecraft_version-$patchouli_version-NEOFORGE")
    implementation("thedarkcolour:kotlinforforge-neoforge:$kff_version")
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk8"

    // Architectury API: registries, networking and events (the 1.19.2 code was built on it).
    implementation("dev.architectury:architectury-neoforge:$architectury_api_version")

    // Inline is required by HexCasting 0.12 at runtime.
    localRuntime("maven.modrinth:inline:$minecraft_version-$inline_version-neoforge")

    // Curios: optional slot for the casting ring.
    compileOnly("top.theillusivec4.curios:curios-neoforge:$curios_version:api")
    localRuntime("top.theillusivec4.curios:curios-neoforge:$curios_version")

    // EMI: optional recipe viewer, only needed to compile the recipe categories.
    compileOnly("maven.modrinth:emi:$emi_version")
    localRuntime("maven.modrinth:emi:$emi_version")
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '10000']
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Dev helper: dumps the compile classpath for quick javac checks (see PORTING_NOTES.md).
tasks.register('printCompileClasspath') {
    def cp = sourceSets.main.compileClasspath
    doLast { file("build/compile-classpath.txt").text = cp.asPath }
}
