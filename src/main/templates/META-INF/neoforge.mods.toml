modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"
issueTrackerURL = "https://github.com/SamsTheNerd/HexGloop/issues"
showAsResourcePack = false

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
displayURL = "https://github.com/SamsTheNerd/HexGloop"
logoFile = "GloopIcon.png"
authors = "${mod_authors}"
description = "${mod_description}"

[[mixins]]
config = "hexgloop-common.mixins.json"

[[mixins]]
config = "hexgloop-neoforge.mixins.json"

[[dependencies.${mod_id}]]
    modId = "neoforge"
    type = "required"
    versionRange = "[${neo_version},)"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "minecraft"
    type = "required"
    versionRange = "${minecraft_version_range}"
    ordering = "NONE"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "hexcasting"
    type = "required"
    versionRange = "[0.12.0,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "hexal"
    type = "optional"
    versionRange = "[0.3.0,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "moreiotas"
    type = "optional"
    versionRange = "[0.1.0,)"
    ordering = "AFTER"
    side = "BOTH"

[[dependencies.${mod_id}]]
    modId = "curios"
    type = "optional"
    versionRange = "[9.0.0,)"
    ordering = "NONE"
    side = "BOTH"
